# Test stack for the fork's lean storage (branch `integrity`). Use a DUMMY mailbox or EML
# import here, not real mail, until the verify-all job exists.
#
#   mkdir -p originals pgdata logs keys manifests
#   export DB_PASSWORD='<long random>' ADMIN_PASSWORD='<long random>'
#   docker compose -f deploy/compose.lean-test.yml up -d
#
# Open http://<host>:5000, log in as admin with ADMIN_PASSWORD. Secrets come from the environment
# (the stack refuses to start without them); nothing secret is stored in this file.

services:
  mailarchiver:
    image: ghcr.io/thatgoodpickle/mailarchiver:integrity
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=MailArchiver;Username=mailuser;Password=${DB_PASSWORD:?set DB_PASSWORD}"
      Authentication__Username: admin
      Authentication__Password: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD}"
      # The REST API (and the API Keys page) is off by default; the integrity endpoints need it.
      Api__Enabled: "true"
      # Lean storage: the app refuses to start unless ALL of these are set as shown.
      Storage__Mode: Lean
      RawMessages__Enabled: "true"
      RawMessages__Storage: filesystem
      RawMessages__FileSystem__BasePath: /data/originals
      RawMessages__FileSystem__HashNamed: "true"
      RawMessages__MaxMessageSizeMb: "0"
    volumes:
      - ./originals:/data/originals       # the evidence: back this up first
      - ./logs:/app/logs
      - ./keys:/app/DataProtection-Keys
      - ./manifests:/app/Manifests         # signed manifests and the signing key: must survive a container recreate
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: MailArchiver
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailuser -d MailArchiver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
